  <g id="text_31">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="234.338633" transform="rotate(-0 3.6 234.338633)">Designed boundary fixtures with author-chosen thresholds. The values are not measurements of any deployed</text>
  </g>
  <g id="text_32">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="243.858633" transform="rotate(-0 3.6 243.858633)">model, and the n = 18 fixture sits where percentile-bootstrap bias is not negligible. The altered-profile fixture</text>
  </g>
  <g id="text_33">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="253.378633" transform="rotate(-0 3.6 253.378633)">has scores identical to the supported fixture: its denial is driven by the profile digest alone. The four plotted</text>
  </g>
  <g id="text_34">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="262.898633" transform="rotate(-0 3.6 262.898633)">fixtures cover 90 of the 104 transactions; the remaining 14 use two profile variants this laboratory owns in the</text>
  </g>
  <g id="text_35">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="272.418633" transform="rotate(-0 3.6 272.418633)">same fixture schema, scored identically to the supported fixture and passed by the unmodified SAFE evaluator,</text>
  </g>
  <g id="text_36">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="281.938633" transform="rotate(-0 3.6 281.938633)">which differ only in profile identity and are therefore not SAFE boundary cases.</text>
  </g>
