  <g id="text_34">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="225.746633" transform="rotate(-0 3.6 225.746633)">Proof by construction plus corpus coverage on a designed 104-transaction corpus (89 strict denies). The four-of-five</text>
  </g>
  <g id="text_35">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="235.266633" transform="rotate(-0 3.6 235.266633)">total (31) is the 23 single-fault denies plus the 8 cross-layer denials, verified as set equality on transaction identifiers,</text>
  </g>
  <g id="text_36">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="244.786633" transform="rotate(-0 3.6 244.786633)">so it measures corpus composition and nothing else. A majority cannot represent a cross-layer denial at all: those</text>
  </g>
  <g id="text_37">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="254.306633" transform="rotate(-0 3.6 254.306633)">transactions have zero failing verifiers. No bar is a rate or an estimate of behaviour in any deployed system.</text>
  </g>
  <g id="text_38">
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="263.826633" transform="rotate(-0 3.6 263.826633)">Ablations are author-defined experimental profiles, not representations of named external products.</text>
  </g>
 </g>
