   <g id="text_36">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="287.016133" transform="rotate(-0 3.6 287.016133)">Diagonal (bold) = transactions in which the layer failed; off-diagonal = transactions in</text>
   </g>
   <g id="text_37">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="296.536133" transform="rotate(-0 3.6 296.536133)">which both layers failed, over 104 transactions and 89 denies. Every off-diagonal cell is</text>
   </g>
   <g id="text_38">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="306.056133" transform="rotate(-0 3.6 306.056133)">at least 5: the corpus was engineered so that no cell is zero, so cell magnitudes reflect</text>
   </g>
   <g id="text_39">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="315.576133" transform="rotate(-0 3.6 315.576133)">corpus construction, not failure prevalence anywhere. The matrix ranges over the five</text>
   </g>
   <g id="text_40">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="325.096133" transform="rotate(-0 3.6 325.096133)">artefact verifiers only, so the 8 cross-layer denials — denials with an empty failed-layer</text>
   </g>
   <g id="text_41">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="334.616133" transform="rotate(-0 3.6 334.616133)">set — appear in no cell of it. Counts on a designed corpus with author-written labels;</text>
   </g>
   <g id="text_42">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="344.136133" transform="rotate(-0 3.6 344.136133)">they are not rates. State failures are structural-appraisal outcomes, not attestation</text>
   </g>
   <g id="text_43">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="3.6" y="353.656133" transform="rotate(-0 3.6 353.656133)">verdicts of any runtime.</text>
